<div class="modal-header">
  <h4 class="modal-title">Language, Footer &amp; Member Status Config</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<p class="modal-body">Configure Language key, Footer Status and Member Status</p>

<div class="modal-body">
  <div class="form-group">
    <label>Language Key</label>
    <input type="text" class="form-control" [(ngModel)]="languageKey" />
  </div>

  <div class="form-group">
    <label>Footer Status</label>
    <select class="form-control" [(ngModel)]="isFooterActive">
      <option [ngValue]="true">Active</option>
      <option [ngValue]="false">Inactive</option>
    </select>
  </div>

  <div class="form-group">
    <label>Member Status</label>
    <select class="form-control" [(ngModel)]="isActive">
      <option [ngValue]="true">Active</option>
      <option [ngValue]="false">Inactive (never shown in footer)</option>
    </select>
  </div>
</div>

<div class="modal-footer">
  <button class="edit-button" (click)="onSubmit()">Update</button>
  <button class="btn btn-link" (click)="onCancel()">Cancel</button>
</div>
